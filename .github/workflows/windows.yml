# Builds the Windows installer (Mochiboard-Setup.exe) on GitHub's Windows machines.
# Run it from the Actions tab (or `gh workflow run windows.yml --ref <branch>`); the installer is attached to the run as an artifact.
# It never publishes a release on its own.
name: Windows build
on:
  workflow_dispatch:
  push:
    branches: [windows]   # the Windows work lives on its own branch; every push there builds a fresh installer
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Use the version in VERSION
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          (Get-Content src-tauri/Cargo.toml) -replace '^version = ".*"', "version = `"$v`"" | Set-Content src-tauri/Cargo.toml
          "MB_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build
        env:
          MB_UPDATE_FEED: https://jessa.art/share/4o92hg0sx7/latest.json   # test builds update from the private feed, not public releases
          MB_BUILD: ${{ github.run_number }}
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis
      - name: Remember the build number
        shell: pwsh
        run: '"${{ github.run_number }}" | Out-File -NoNewline out-build.txt'
      - name: Name the installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item $exe.FullName out/Mochiboard-Setup.exe
          Get-Item out/Mochiboard-Setup.exe | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: Mochiboard-Setup-${{ env.MB_VERSION }}-windows
          path: |
            out/Mochiboard-Setup.exe
            out-build.txt
