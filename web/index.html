<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mochiboard</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- the wobbly hand-cut edge every frame wears -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="wob" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<aside class="side" id="side">
  <section class="box" data-box="boards">
    <header><div class="brand" id="brand" title="Home: all projects"><canvas id="brandGoo" width="40" height="36"></canvas><span>Mochiboard</span></div><button class="mini" title="Minimize">–</button></header>
    <div class="box-body">
      <button class="home-row" id="homeBtn"><svg viewBox="0 0 20 20" width="16" height="16"><path d="M3 9.5 10 3.5l7 6V16a1.5 1.5 0 0 1-1.5 1.5h-3v-5h-5v5h-3A1.5 1.5 0 0 1 3 16z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>All projects</button>
      <div class="label" id="treeLabel">Everything</div>
      <div class="boards" id="boards"></div>
      <div class="new-row"><button class="pill-btn" id="newBoard">+ Board</button><button class="pill-btn" id="newFolder">+ Folder</button><button class="pill-btn" id="newProject">+ Project</button></div>
    </div>
  </section>
  <section class="box" data-box="start">
    <header><div class="label">Start from</div><button class="mini" title="Minimize">–</button></header>
    <div class="box-body"><div class="templates" id="templates"></div></div>
  </section>
  <section class="box" data-box="colors">
    <header><div class="label">Board colors</div><button class="mini" title="Minimize">–</button></header>
    <div class="box-body"><div class="palette" id="palette"></div></div>
  </section>
  <section class="box" data-box="helpers">
    <header><div class="label">Mochi's helpers</div><button class="mini" title="Minimize">–</button></header>
    <div class="box-body"><div class="conns" id="conns"></div></div>
  </section>
</aside>

<main class="stage" id="stage">
  <div class="grid" id="grid"></div>
  <div class="world" id="world">
    <svg class="wires" id="wires"></svg>
    <div class="cards" id="cards"></div>
  </div>
  <div class="marquee" id="marquee"></div>
  <div class="focus-veil" id="veil"></div>

  <header class="top">
    <nav class="crumbs" id="crumbs"></nav>
    <input class="board-name" id="boardName" spellcheck="false" aria-label="Board name">
    <span class="saved" id="saved">saved</span>
  </header>

  <div class="tools" id="tools">
    <button data-add="note" aria-label="Note · N" data-tip="Note · N"><svg class="ic" viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 3.5h11a1 1 0 0 1 1 1v7.5l-4.5 4.5H4.5a1 1 0 0 1-1-1v-11a1 1 0 0 1 1-1z"/><path d="M16.5 12h-3.5a1 1 0 0 0-1 1v3.5"/></svg></button>
    <button data-add="todo" aria-label="Checklist · C" data-tip="Checklist · C"><svg class="ic" viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="4" height="4" rx="1.2"/><path d="m3.9 13.2 1.1 1.1 2-2.2"/><path d="M10 6h7M10 13.5h7"/></svg></button>
    <button data-add="title" aria-label="Big title · T" data-tip="Big title · T"><svg class="ic" viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5V4h12v1.5M10 4v12M7.5 16h5"/></svg></button>
    <button data-add="link" aria-label="Link · L" data-tip="Link · L"><svg class="ic" viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 11.5a3.2 3.2 0 0 0 4.5 0l2.6-2.6a3.2 3.2 0 0 0-4.5-4.5l-.9.9"/><path d="M11.5 8.5a3.2 3.2 0 0 0-4.5 0l-2.6 2.6a3.2 3.2 0 0 0 4.5 4.5l.9-.9"/></svg></button>
    <button data-add="image" aria-label="Image · I" data-tip="Image · I"><svg class="ic" viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="14" height="13" rx="2.5"/><circle cx="7.5" cy="8" r="1.5"/><path d="m17 13-3.8-3.6L5 16.5"/></svg></button>
    <button data-add="swatch" aria-label="Color" data-tip="Color"><svg class="ic" viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3a7 7 0 1 0 0 14c1 0 1.6-.7 1.6-1.5 0-.9-.6-1.2-.6-2 0-.9.7-1.5 1.6-1.5H15a2 2 0 0 0 2-2C17 6 13.9 3 10 3z"/><circle cx="6.8" cy="9" r=".9" fill="currentColor" stroke="none"/><circle cx="9" cy="6.3" r=".9" fill="currentColor" stroke="none"/><circle cx="12.4" cy="6.6" r=".9" fill="currentColor" stroke="none"/></svg></button>
    <span class="zoom" id="zoom">100%</span>
  </div>

  <aside class="tray" id="tray">
    <div class="tray-head"><span class="label">Unsorted</span><b id="trayCount">0</b></div>
    <div class="tray-hint">ideas waiting for a spot. drag one onto the board ✦</div>
    <div class="tray-list" id="trayList"></div>
  </aside>

  <!-- home: zoomed all the way out, every project → its folders → its boards -->
  <section class="home" id="home">
    <div class="home-in">
      <div class="home-nav"><button class="home-back" id="homeBack">← Back</button><nav class="home-crumbs" id="homeCrumbs"></nav></div>
      <div class="home-head"><div><h1 id="homeTitle">Your projects</h1><p id="homeSub"></p></div><button class="home-close" id="homeClose">Back to board</button></div>
      <div class="home-grid" id="homeGrid"></div>
    </div>
  </section>

  <!-- Mochi: her pill, her bar, her bubble -->
  <div class="mochi" id="mochi">
    <div class="m-bubble" id="mBubble"><small>mochi</small><p id="mSay"></p><div class="m-acts" id="mActs"></div></div>
    <div class="m-pill" id="mPill">
      <canvas id="goo" width="64" height="56"></canvas>
      <span class="m-name" id="mName">Mochi</span>
      <form id="mForm" class="m-form"><input id="mInput" placeholder="Ask Mochi… “group these by theme”" autocomplete="off"></form>
    </div>
  </div>

  <!-- paste a link: drops under the toolbar -->
  <form class="linkbox" id="linkbox"><input id="linkInput" placeholder="Paste a link… (a site, a Figma file, a video)" autocomplete="off" spellcheck="false"><button>Add</button></form>
  <div class="capture" id="capture">
    <form id="capForm"><input id="capInput" placeholder="Dump an idea… it goes in Unsorted (paste a link or image too)" autocomplete="off"></form>
  </div>
  <div class="keys" id="keys"><span><kbd>⌘K</kbd> quick capture</span><span><kbd>double-click</kbd> new note</span><span><kbd>F</kbd> focus</span><span><kbd>M</kbd> ask Mochi</span><span><kbd>space</kbd> drag to pan</span><button id="keysX" title="Hide">×</button></div>
  <!-- the little bar above whatever is selected: fill color, a label, edit, ask Mochi, delete -->
  <div class="selbar" id="selbar">
    <div class="sb-dots" id="sbDots"></div><span class="sb-sep"></span>
    <button data-sb="tag" title="Add or edit the little label above the card">+ Label</button>
    <button data-sb="edit" title="Edit the words">Edit</button>
    <button data-sb="mochi" title="Ask Mochi to change this">✦ Ask Mochi</button>
    <button data-sb="del" class="sb-del" title="Delete">×</button>
  </div>
  <!-- the color editor: pops up beside a color card -->
  <div class="cpop" id="cpop">
    <div class="wheel" id="wheel"><canvas id="wheelCv" width="440" height="440"></canvas><i class="ring" id="wheelRing"></i></div>
    <div class="bright" id="bright"><i class="ring" id="brightRing"></i></div>
    <div class="cp-row"><span class="cp-dot" id="cpDot"></span>
      <div class="cp-fields"><input id="cpHex" maxlength="7" spellcheck="false" aria-label="Hex"><input id="cpName" placeholder="Name it (e.g. Blush Pop)" spellcheck="false" aria-label="Color name"></div></div>
    <div class="cp-quick" id="cpQuick"></div>
    <div class="cp-acts"><button id="cpSave" class="solid">Save to board colors</button><button id="cpDone">Done</button></div>
  </div>
  <input type="file" id="filePick" accept="image/*" multiple hidden>
  <input type="file" id="coverPick" accept="image/*" hidden>
</main>

<script src="bridge.js"></script>
<script src="goo.js"></script>
<script src="app.js"></script>
</body>
</html>
